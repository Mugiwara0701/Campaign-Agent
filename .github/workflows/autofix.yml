name: Auto-fix lint

# On every push to a branch other than main, apply ruff fixes and formatting
# and commit them back. main is never rewritten by a bot; CI just fails there.
on:
  push:
    branches-ignore:
      - main

permissions:
  contents: write

jobs:
  autofix:
    runs-on: ubuntu-latest
    # Skip the bot's own commit so it cannot loop.
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: |
          ruff check --fix .
          ruff format .
      - name: Commit fixes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "style: auto-fix lint and formatting"
            git push
          fi
