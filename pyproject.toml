[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "campaign-agent"
version = "0.1.0"
description = "Turns a plain-language campaign description into a validated, versioned Marketing Agent campaign configuration."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "yamllint>=1.35",
    "httpx>=0.27",
    "pydantic-settings>=2.2",
    "psycopg[binary]>=3.1",
    "uvicorn>=0.29",
    "pyjwt[crypto]>=2.8",  # the gateway checks the signed-in dashboard user's token (api/users.py)
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "sqlfluff>=3.0",
    "pip-audit>=2.7",
    "types-PyYAML",
    "pre-commit>=3.7",
    "reportlab>=4.0",  # the PDF of the qa soak test (qa/make_report.py)
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
campaign_agent = ["py.typed", "contract/*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "S",        # bandit (security)
    "C4",       # comprehensions
    "SIM",      # simplify
    "RET",      # return
    "PT",       # pytest style
    "RUF",
]

# ruff format wraps code at line-length; E501 would only flag the comments, docstrings and strings it
# cannot split (prompt text, user-facing wording), which is noise.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PT018"]  # plain and compound asserts are fine in tests
# The acceptance/soak suite drives real services: asserts, subprocess, urllib, SQL strings and swallowed errors are its job
"qa/**" = ["S101", "S107", "S605", "SIM115", "SIM117", "B007", "S110", "S112", "S310", "S311", "S603", "S607", "S608", "S105", "S106", "PT018", "SIM105", "RET503", "RUF012"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["campaign_agent"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["yamllint", "yamllint.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: needs a database (TEST_DATABASE_URL) or other external service",
    "e2e: end to end, needs the Marketing Agent loader",
]

[tool.coverage.run]
source = ["campaign_agent"]
branch = true

[tool.coverage.report]
show_missing = true
