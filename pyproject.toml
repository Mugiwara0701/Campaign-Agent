[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "campaign-agent"
version = "0.0.0"
description = "Turns a plain-language campaign description into a validated, versioned Marketing Agent campaign configuration."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "yamllint>=1.35",
    "sqlfluff>=3.0",
    "pip-audit>=2.7",
    "types-PyYAML",
    "pre-commit>=3.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
campaign_agent = ["py.typed", "contract/*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "S",        # bandit (security)
    "C4",       # comprehensions
    "SIM",      # simplify
    "RET",      # return
    "PT",       # pytest style
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is fine in tests

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["campaign_agent"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: needs a database or other external service",
    "e2e: end to end, needs the Marketing Agent loader",
]

[tool.coverage.run]
source = ["campaign_agent"]
branch = true

[tool.coverage.report]
show_missing = true
